<style>
.loader-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255, 255, 255, 0.8);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  visibility: hidden;
}

.loader-overlay.active {
  visibility: visible;
}

.spinner {
  position: relative;
  width: 150px;
  height: 150px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.spinner-ring {
  position: absolute;
  width: 200px;
  height: 200px;
  border: 8px solid #f3f3f3;
  border-top: 8px solid #FF9800;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

.spinner-logo {
  width: 150px;
  height: 150px;
  object-fit: contain;
  z-index: 1; /* keep above the ring */
}

@keyframes spin {
  100% {
    transform: rotate(360deg);
  }
}


</style>
<div id="loader" class="loader-overlay">
  <div class="spinner">
    <div class="spinner-ring"></div>
    <img src="junk_manager_logo.png" alt="App Logo" class="spinner-logo">
  </div>
</div>

<script>
(function () {
  // js/loader.js
document.addEventListener("DOMContentLoaded", () => {
  const loader = document.getElementById("loader");
  if (!loader) return;

  function showLoader() {
    loader.classList.add("active");
  }

  function hideLoader() {
    loader.classList.remove("active");
  }

  // Hide when page fully loads
  window.addEventListener("load", hideLoader);

  // 🔹 Handle all forms
  document.addEventListener("submit", (e) => {
    // only for real submits, not prevented ones
    if (!e.defaultPrevented) {
      showLoader();
    }
  }, true);

document.addEventListener("click", (e) => {
  if (e.defaultPrevented) return;
  if (e.button !== 0) return; // left click only
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

  const a = e.target.closest("a");
  const button = e.target.closest("button");

  // 🚫 Skip loader for export buttons
if (button && (
  button.id === "export-btn" ||
  button.id === "pdf-btn" ||
  button.id === "exportBtn" ||
  button.id === "exportReportBtn"
)) return;

  if (!a) return;
  const href = a.getAttribute("href");
  if (!href || href.startsWith("#") || href.startsWith("javascript:")) return;

  const t = (a.getAttribute("target") || "").toLowerCase();
  if (t === "_blank") return;

  showLoader();
}, true);


  // Expose if you still want manual control
  window.showLoader = showLoader;
  window.hideLoader = hideLoader;
});
})();
</script>
